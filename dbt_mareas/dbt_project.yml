name: 'dbt_mareas'
version: '1.0.0'
config-version: 2

profile: 'dbt_mareas'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_mareas:
    # Un unico dataset provisionado (mareas_raw): todos los modelos se
    # materializan ahi, sin +schema custom, para no requerir datasets
    # adicionales en GCP.
    staging:
      +materialized: view
    marts:
      +materialized: table
